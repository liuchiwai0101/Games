<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>五子棋</title>
    <meta name="description" content="十五路五子棋。同機對下，或跟電腦下。連成五子就贏。" />
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../play.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="top">
      <a class="ghost" href="../">遊戲</a>
      <div class="brand">
        <p class="eyebrow">棋</p>
        <h1>五子棋</h1>
      </div>
      <button type="button" id="reset" class="textbtn">重開</button>
    </header>
    <main class="stage">
      <div class="modes" role="group" aria-label="對手">
        <button type="button" data-mode="ai" class="textbtn on">電腦</button>
        <button type="button" data-mode="hot" class="textbtn">同機</button>
      </div>
      <p id="status" class="status">輪到黑子。</p>
      <div id="board" class="board" role="grid"></div>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
