<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>紅警 2</title>
    <meta name="description" content="網頁紅井 RA2WEB。既有的紅警 2 瀏覽器對戰版，嵌在遊戲清單裡。" />
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: dark;
        --ink: #f6efe4;
        --muted: #e7b2a8;
        --line: rgba(224, 122, 104, 0.45);
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: #140c0c;
        color: var(--ink);
        font-family: "Noto Serif TC", "Songti TC", serif;
      }
      body {
        display: flex;
        flex-direction: column;
        min-height: 100%;
      }
      .bar {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px;
        padding: max(8px, env(safe-area-inset-top)) 12px 8px;
        border-bottom: 1px solid var(--line);
        background: #1c1010;
      }
      .ghost, .open {
        border-radius: 999px;
        padding: 6px 12px;
        letter-spacing: 0.12em;
        text-decoration: none;
        color: inherit;
        border: 1px solid var(--line);
      }
      .title {
        margin: 0;
        font-size: 18px;
        font-weight: 500;
        letter-spacing: 0.14em;
      }
      .credit {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        letter-spacing: 0.06em;
      }
      .spacer { flex: 1; }
      .stage {
        flex: 1;
        min-height: 0;
        background: #000;
      }
      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: #000;
      }
    </style>
  </head>
  <body>
    <header class="bar">
      <a class="ghost" href="../">遊戲</a>
      <h1 class="title">紅警 2</h1>
      <p class="credit">RA2WEB · 網頁紅井 · 紅色井界</p>
      <span class="spacer"></span>
      <a class="open" href="https://ra2web.github.io/" target="_blank" rel="noreferrer">單獨開啟</a>
    </header>
    <div class="stage">
      <iframe
        src="https://ra2web.github.io/"
        title="RA2WEB 網頁紅井"
        allow="fullscreen; autoplay; gamepad; clipboard-write"
      ></iframe>
    </div>
  </body>
</html>
