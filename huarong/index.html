<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>華容道</title>
    <meta name="description" content="華容道。把曹操移到出口。點選木塊，再用方向移動。" />
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../play.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="top">
      <a class="ghost" href="../">遊戲</a>
      <div class="brand">
        <p class="eyebrow">解謎</p>
        <h1>華容道</h1>
      </div>
      <button type="button" id="reset" class="textbtn">重開</button>
    </header>
    <main class="stage">
      <p id="status" class="status">點選木塊，再按方向。曹操要到底下的出口。</p>
      <div id="board" class="board"></div>
      <div class="dirs" aria-label="方向">
        <button type="button" data-dir="0,-1">上</button>
        <button type="button" data-dir="-1,0">左</button>
        <button type="button" data-dir="0,1">下</button>
        <button type="button" data-dir="1,0">右</button>
      </div>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
